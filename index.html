<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>시몬스 뉴스</title>
    <meta name="description" content="국내 60 · 해외 40 비중의 주요 뉴스와 과학·전기 소식" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="시몬스 뉴스" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <h1>시몬스 뉴스</h1>
        <span class="updated" id="updatedAt">불러오는 중…</span>
      </div>
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="top" class="active">주요</button>
        <button role="tab" data-tab="kr">국내</button>
        <button role="tab" data-tab="intl">해외</button>
        <button role="tab" data-tab="science">과학·전기</button>
        <button role="tab" data-tab="theme">테마</button>
      </nav>
    </header>

    <div class="stale-banner" id="staleBanner" role="status" hidden></div>

    <main>
      <div class="controls">
        <input id="search" type="search" placeholder="검색" autocomplete="off" />
        <div class="chips" id="chips" role="group" aria-label="분야 선택"></div>
      </div>
      <p class="tab-note" id="tabNote"></p>
      <ol class="list" id="list"></ol>
      <button class="more" id="more" hidden>더 보기</button>
    </main>

    <footer class="foot">
      <p id="lastGood"></p>
      <details>
        <summary id="statusSummary">소스 상태</summary>
        <ul id="healthNotes" class="notes"></ul>
        <ul id="statusList"></ul>
      </details>
      <p>기사 제목·요약·링크만 표시합니다. 원문 저작권은 각 언론사에 있습니다.</p>
    </footer>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
