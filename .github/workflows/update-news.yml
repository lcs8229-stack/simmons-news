name: Update and deploy

on:
  workflow_dispatch:
    inputs:
      simulate_cache_loss:
        description: "캐시를 쓰지 않고 스냅샷에서 복구하는 경로를 시험 (docs/OPERATIONS.md 4절)"
        type: boolean
        default: false
  schedule:
    # 매시 17분(UTC)에 실행. 정각은 GitHub 서버가 붐벼 지연되기 쉽다.
    - cron: "17 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # 스냅샷 artifact 목록 조회·내려받기

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 배포된 페이지 주소. 캐시가 사라졌을 때 소스 이력과 품질 기준값을 여기서 복구한다.
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q

      # 아카이브(기사 기록)와 소스 이력은 git 대신 Actions 캐시에 보관한다.
      # 캐시가 없으면(7일 미사용 삭제 등) 새로 수집해 복구한다. docs/OPERATIONS.md 참고.
      # 캐시는 저장 경로 목록이 바뀌면 이전 것을 못 찾으므로, 아카이브와 이력을 따로 둔다.
      - name: Restore archive
        if: ${{ !inputs.simulate_cache_loss }}
        uses: actions/cache/restore@v4
        with:
          path: data/archive.json
          key: archive-${{ github.run_id }}
          restore-keys: archive-

      - name: Restore source history and quality baseline
        if: ${{ !inputs.simulate_cache_loss }}
        uses: actions/cache/restore@v4
        with:
          path: data/state
          key: state-${{ github.run_id }}
          restore-keys: state-

      # 캐시가 없으면 가장 최근 스냅샷(품질 검사를 통과한 실행이 올린 artifact)에서 복구한다.
      # 무결성(sha256)이 맞지 않으면 복구하지 않고 새로 수집한다. 결과는 news.json coverage.restored_from.
      - name: Restore from snapshot if cache is missing
        if: ${{ hashFiles('data/archive.json') == '' || hashFiles('data/state/theme_candidates.json') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=state-snapshot&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false)][0].archive_download_url // empty' || true)
          if [ -z "$url" ]; then echo "사용할 스냅샷 없음: 새로 수집합니다"; exit 0; fi
          gh api "$url" > snapshot.zip && mkdir -p snapshot && unzip -q snapshot.zip -d snapshot
          python scripts/state_snapshot.py restore --snapshot snapshot --data-dir data || echo "스냅샷 검증 실패: 새로 수집합니다"

      - name: Build news data
        id: build
        run: python scripts/build_news.py --sources feeds/sources.opml --output-dir data

      # 실패하면(종료 코드 1) 아래 배포 단계가 모두 건너뛰어지고 기존 페이지가 유지된다.
      - name: Quality gate
        id: gate
        run: python scripts/quality_gate.py --data-dir data

      # 품질 검사가 실패해도 아카이브·이력(연속 실패 횟수 등)은 저장한다.
      - name: Save archive
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/archive.json
          key: archive-${{ github.run_id }}

      - name: Save source history and quality baseline
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/state
          key: state-${{ github.run_id }}

      # 품질 검사를 통과한 상태를 스냅샷으로 따로 보관 (Actions 캐시와 별개, 30일).
      # 매일 UTC 0시대 실행, 수동·push 실행, 스냅샷에서 복구한 실행에서 올린다.
      - name: Decide snapshot
        id: snapdue
        run: |
          due=false
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%H)" = "00" ]; then due=true; fi
          if [ -n "$(ls snapshot 2>/dev/null)" ]; then due=true; fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

      - name: Create snapshot
        if: steps.snapdue.outputs.due == 'true'
        run: python scripts/state_snapshot.py create --data-dir data --out state-snapshot

      - name: Upload snapshot
        if: steps.snapdue.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: state-snapshot
          path: state-snapshot
          retention-days: 30
          if-no-files-found: error

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html manifest.json _site/
          cp -r assets _site/
          cp data/news.json data/status.json data/health.json data/theme.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 선택: 외부 감시 서비스(예: Healthchecks.io)에 성공/실패를 알린다.
      # 저장소 Settings → Secrets and variables → Actions 에 HEALTHCHECK_URL 을 넣어야 동작한다.
      # 설정하지 않으면 아무 일도 하지 않는다.
      - name: Ping external monitor (optional)
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          JOB_OK: ${{ job.status == 'success' }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then echo "HEALTHCHECK_URL 미설정: 외부 감시 알림 없음"; exit 0; fi
          if [ "$JOB_OK" = "true" ]; then url="$HEALTHCHECK_URL"; else url="$HEALTHCHECK_URL/fail"; fi
          curl -fsS -m 10 --retry 3 "$url" > /dev/null || echo "외부 감시 알림 실패"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
